<svg width="900" height="100" viewBox="0 0 900 100"
     xmlns="http://www.w3.org/2000/svg">

  <rect
    width="900"
    height="100"
    rx="14"
    fill="#0d1117"/>

  <style>
    .typing {
      font-family: "Courier New", monospace;
      font-size: 30px;
      font-weight: 500;
      fill: #58a6ff;
    }

    .cursor {
      fill: #58a6ff;
    }
  </style>

  <!-- =====================================================
       ONE TEXT ELEMENT
       No overlapping text layers
       ===================================================== -->

  <text
    x="35"
    y="62"
    class="typing">

    <!-- Phrase 1 -->
    <tspan>
      Frontend Developer
      <set
        attributeName="opacity"
        to="0"
        begin="4.8s"
        dur="0.01s"/>
    </tspan>

    <!-- Phrase 2 -->
    <tspan
      opacity="0">

      JavaScript Developer

      <set
        attributeName="opacity"
        to="1"
        begin="5s"
        dur="0.01s"/>

      <set
        attributeName="opacity"
        to="0"
        begin="9.8s"
        dur="0.01s"/>

    </tspan>

    <!-- Phrase 3 -->
    <tspan
      opacity="0">

      Building Modern Web Experiences

      <set
        attributeName="opacity"
        to="1"
        begin="10s"
        dur="0.01s"/>

      <set
        attributeName="opacity"
        to="0"
        begin="14.8s"
        dur="0.01s"/>

    </tspan>

    <!-- Phrase 1 returns -->
    <set
      attributeName="opacity"
      to="1"
      begin="15s"
      dur="0.01s"/>

  </text>

  <!-- =====================================================
       TYPEWRITER MASK
       Reveals each phrase from left → right
       ===================================================== -->

  <mask id="typingMask">

    <rect
      x="0"
      y="0"
      width="900"
      height="100"
      fill="black"/>

    <rect
      x="35"
      y="15"
      width="0"
      height="65"
      fill="white">

      <animate
        attributeName="width"
        values="
          0;
          380;
          380;
          0;
          0;
          450;
          450;
          0;
          0;
          570;
          570;
          0;
          0
        "
        keyTimes="
          0;
          0.20;
          0.26;
          0.33;
          0.33;
          0.53;
          0.59;
          0.66;
          0.66;
          0.86;
          0.92;
          0.99;
          1
        "
        dur="15s"
        repeatCount="indefinite"/>

    </rect>

  </mask>

  <!-- =====================================================
       CLEAN TYPEWRITER TEXT
       ===================================================== -->

  <g mask="url(#typingMask)">

    <text
      x="35"
      y="62"
      class="typing">

      Frontend Developer

    </text>

  </g>

  <!-- =====================================================
       CURSOR
       ===================================================== -->

  <rect
    x="35"
    y="30"
    width="3"
    height="38"
    class="cursor">

    <!-- cursor movement -->
    <animate
      attributeName="x"
      values="
        35;
        410;
        410;
        35;
        35;
        480;
        480;
        35;
        35;
        600;
        600;
        35
      "
      keyTimes="
        0;
        0.20;
        0.26;
        0.33;
        0.33;
        0.53;
        0.59;
        0.66;
        0.66;
        0.86;
        0.92;
        0.99
      "
      dur="15s"
      repeatCount="indefinite"/>

    <!-- blinking cursor -->
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.75s"
      repeatCount="indefinite"/>

  </rect>

</svg>
