<svg width="900" height="100" viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <clipPath id="typingClip">
      <rect x="30" y="0" width="0" height="100">
        <animate
          attributeName="width"
          values="0;390;390;0"
          keyTimes="0;0.45;0.75;1"
          dur="4s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="typingClip2">
      <rect x="30" y="0" width="0" height="100">
        <animate
          attributeName="width"
          values="0;470;470;0"
          keyTimes="0;0.45;0.75;1"
          begin="4s"
          dur="4s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="typingClip3">
      <rect x="30" y="0" width="0" height="100">
        <animate
          attributeName="width"
          values="0;500;500;0"
          keyTimes="0;0.45;0.75;1"
          begin="8s"
          dur="4s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect
    width="900"
    height="100"
    rx="16"
    fill="#0d1117"
    stroke="#30363d"
    stroke-width="1"/>

  <!-- LINE 1 -->
  <g clip-path="url(#typingClip)">
    <text
      x="30"
      y="62"
      font-family="monospace"
      font-size="30"
      font-weight="600"
      fill="#58a6ff">
      Frontend Developer
    </text>
  </g>

  <!-- LINE 2 -->
  <g clip-path="url(#typingClip2)">
    <text
      x="30"
      y="62"
      font-family="monospace"
      font-size="30"
      font-weight="600"
      fill="#58a6ff">
      Building Modern Web Experiences
    </text>
  </g>

  <!-- LINE 3 -->
  <g clip-path="url(#typingClip3)">
    <text
      x="30"
      y="62"
      font-family="monospace"
      font-size="30"
      font-weight="600"
      fill="#58a6ff">
      Learning • Building • Improving
    </text>
  </g>

  <!-- CURSOR -->
  <rect
    x="32"
    y="30"
    width="3"
    height="38"
    fill="#58a6ff">

    <animate
      attributeName="x"
      values="32;405;32;32;500;32;32;530;32"
      keyTimes="0;0.45;0.5;0.5;0.95;1;1;1;1"
      dur="12s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="1;1;0;1;1;0;1;1;0"
      keyTimes="0;0.45;0.5;0.55;0.95;0.97;0.98;0.99;1"
      dur="12s"
      repeatCount="indefinite"/>
  </rect>

</svg>
